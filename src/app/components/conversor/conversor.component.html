<div class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      
      <div class="card shadow-lg border-0">
        <div class="card-header bg-success text-white text-center p-3">
          <h3 class="mb-0">Conversor de Divisas</h3>
        </div>
        
        <div class="card-body p-4 bg-light">
          <div class="mb-4">
            <label class="form-label fw-bold">Cantidad a convertir:</label>
            <input type="number" class="form-control form-control-lg" [(ngModel)]="cantidad">
          </div>
          
          <div class="row mb-4">
            <div class="col-6">
              <label class="form-label fw-bold">De:</label>
              <select class="form-select form-select-lg" [(ngModel)]="de">
                <option *ngFor="let mon of monedas" [value]="mon">{{ mon }}</option>
              </select>
            </div>
            
            <div class="col-6">
              <label class="form-label fw-bold">A:</label>
              <select class="form-select form-select-lg" [(ngModel)]="a">
                <option *ngFor="let mon of monedas" [value]="mon">{{ mon }}</option>
              </select>
            </div>
          </div>

          <div class="d-grid">
            <button class="btn btn-success btn-lg" (click)="realizarConversion()">
              Convertir Moneda
            </button>
          </div>

          <div class="alert alert-success text-center mt-4 mb-0" *ngIf="resultado !== null">
            <p class="mb-1 text-muted">Monto convertido:</p>
            <h2 class="mb-0 fw-bold">{{ resultado | number:'1.2-2' }} {{ a }}</h2>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
