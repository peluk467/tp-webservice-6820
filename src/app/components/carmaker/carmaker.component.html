<div class="container mt-4">
  <h2 class="bg-dark text-white text-center p-3 rounded mb-4">Catálogo de Autos 🚗</h2>

  <div class="row">
    <div class="col-md-3 mb-4" *ngFor="let marca of marcas">
      <div class="card h-100 text-center shadow" style="cursor: pointer;" 
           (click)="seleccionarMarca(marca)" 
           data-bs-toggle="modal" 
           data-bs-target="#modelosModal">
        <div class="card-body d-flex align-items-center justify-content-center">
          <h4 class="card-title text-primary fw-bold mb-0">
            {{ marca.name ? marca.name : marca }}
          </h4>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="modelosModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content">
      
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">Modelos de {{ marcaSeleccionada }}</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      
      <div class="modal-body">
        
        <div class="text-center my-4" *ngIf="cargandoModelos">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando...</span>
          </div>
          <p class="mt-2 text-muted">Buscando modelos...</p>
        </div>

        <ul class="list-group" *ngIf="!cargandoModelos">
          
          <li class="list-group-item text-primary fw-bold" *ngFor="let modelo of modelos">
            🚗 {{ modelo.name || modelo.model || modelo.make_name || (modelo | json) }}
          </li>
          
        </ul>

        <div class="alert alert-warning mt-3" *ngIf="!cargandoModelos && modelos.length === 0">
          No se encontraron modelos para esta marca.
        </div>

      </div>
      
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>
