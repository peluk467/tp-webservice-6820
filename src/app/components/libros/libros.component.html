<div class="container mt-4 mb-5">
  
  <div class="card shadow-sm border-0 bg-dark text-white mb-4">
    <div class="card-body text-center p-4">
      <h2 class="fw-bold mb-3">Buscador de Libros</h2>
      
      <div class="input-group input-group-lg w-75 mx-auto">
        <input type="text" class="form-control" placeholder="Escribe un título, autor o tema (Ej: El señor de los anillos)" 
               [(ngModel)]="terminoBusqueda" (keyup.enter)="realizarBusqueda()">
        <button class="btn btn-primary" type="button" (click)="realizarBusqueda()" [disabled]="cargando">
          <span *ngIf="!cargando">Buscar</span>
          <span *ngIf="cargando">Buscando...</span>
        </button>
      </div>
    </div>
  </div>

  <div class="text-center my-5" *ngIf="cargando">
    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
      <span class="visually-hidden">Cargando...</span>
    </div>
  </div>

  <div class="alert alert-warning text-center" *ngIf="!cargando && busquedaRealizada && listaLibros.length === 0">
    No se encontraron libros para "{{ terminoBusqueda }}". Intenta con otras palabras.
  </div>

  <div class="row" *ngIf="!cargando && listaLibros.length > 0">
    <div class="col-md-3 mb-4" *ngFor="let libro of listaLibros">
      
      <div class="card h-100 shadow-sm">
        <img *ngIf="libro.cover_i" [src]="'https://covers.openlibrary.org/b/id/' + libro.cover_i + '-M.jpg'" class="card-img-top" alt="Tapa del libro" style="height: 300px; object-fit: cover;">
        <img *ngIf="!libro.cover_i" src="https://via.placeholder.com/300x400?text=Sin+Tapa" class="card-img-top" alt="Sin tapa" style="height: 300px; object-fit: cover;">
        
        <div class="card-body d-flex flex-column">
          <h5 class="card-title text-primary fw-bold">{{ libro.title }}</h5>
          
          <p class="card-text text-muted mb-1">
            <strong>Autor:</strong> {{ libro.author_name ? libro.author_name[0] : 'Desconocido' }}
          </p>
          
          <p class="card-text text-muted">
            <strong>Año:</strong> {{ libro.first_publish_year ? libro.first_publish_year : 'N/A' }}
          </p>
          
          <button class="btn btn-outline-secondary mt-auto btn-sm" disabled>Ver Detalles</button>
        </div>
      </div>

    </div>
  </div>

</div>
